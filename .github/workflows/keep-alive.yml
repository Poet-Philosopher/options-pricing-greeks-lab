name: Keep Streamlit app awake

# Best effort only - see "Keeping the app awake" in the README.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h; Streamlit sleeps apps after ~12h, so one skipped run is survivable
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04          # pinned: "ubuntu-latest" can silently change OS and break browser installs
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/keep-alive-requirements.txt

      # No browser download: ubuntu-24.04 runners already ship Google Chrome,
      # and the script drives it with channel="chrome". This removes the fragile
      # `playwright install --with-deps` step entirely.
      - name: Install Playwright (client only)
        run: pip install -r scripts/keep-alive-requirements.txt

      - name: Open the app in a real browser (wakes it if asleep)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          python scripts/keep_alive.py "$APP_URL"

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-debug
          path: keep_alive_debug.png
          if-no-files-found: ignore
          retention-days: 7
