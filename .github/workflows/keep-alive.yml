name: Keep Streamlit app awake

# Best effort only - see "Keeping the app awake" in the README.
on:
  schedule:
    - cron: "17 */8 * * *"   # every 8 hours (minute 17 avoids the top-of-hour rush)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
      - name: Open the app in a real browser (wakes it if asleep)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          python scripts/keep_alive.py "$APP_URL"
